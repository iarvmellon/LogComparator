services:
  logcomparator:
    build:
      context: .
      dockerfile: Dockerfile
      # Release versions use Git tags; Docker keeps only this fixed tag.
      tags:
        - logcomparator_iarv:latest
      args:
        BUILD_DESCRIBE: ${LOGCOMPARATOR_VERSION:-container}
        BUILD_GIT_HASH: ${LOGCOMPARATOR_GIT_HASH:-unknown}
    image: logcomparator_iarv:latest
    container_name: logComparator
    # docker_compose.sh detects host CPUs and leaves one CPU for Tango.
    cpus: "${LOGCOMPARATOR_CPU_LIMIT:?Run Compose through sh ./docker_compose.sh on the Docker host}"
    restart: unless-stopped
    init: true
    ports:
      - "${LOGCOMPARATOR_PORT:-4020}:8080"
    environment:
      LOGCOMPARATOR_PARSE_WORKERS: ${LOGCOMPARATOR_PARSE_WORKERS:-4}
      LOGCOMPARATOR_SSL_CERTFILE: /data/tls/server.crt
      LOGCOMPARATOR_SSL_KEYFILE: /data/tls/server.key
      LOGCOMPARATOR_LOG_DIR: /opt/tango/log
      LOGCOMPARATOR_AUDIT_DIR: /opt/tango/audit
      LOGCOMPARATOR_OUTPUT: /data/exports
      LOGCOMPARATOR_CACHE: /data/cache
      NICEGUI_STORAGE_PATH: /data/state
    volumes:
      - type: bind
        source: ${LOGCOMPARATOR_TLS_DIR:-./certs}
        target: /data/tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TANGO_LOG_DIR:-/opt/tango/log}
        target: /opt/tango/log
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TANGO_AUDIT_DIR:-/opt/tango/audit}
        target: /opt/tango/audit
        read_only: true
        bind:
          create_host_path: false
      - exports:/data/exports
      - cache:/data/cache
      - state:/data/state
    # Optional existing Linux group with read access to the Tango directories.
    group_add:
      - "${TANGO_READ_GID:-10001}"
volumes:
  exports:
  cache:
  state:
