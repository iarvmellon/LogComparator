[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logcomparator-web-ui"
version = "1.0.0"
description = "Bundled browser components and build hooks for LogComparator"
requires-python = ">=3.10"

[project.entry-points.pyinstaller40]
hook-dirs = "logcomparator_ui._pyinstaller:get_hook_dirs"

[tool.setuptools.packages.find]
include = ["logcomparator_ui*"]

[tool.setuptools.package-data]
logcomparator_ui = ["*.js", "assets/*", "_pyinstaller/hooks/*.py"]
